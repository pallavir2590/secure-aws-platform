# ---------------------------------------------------------------
# Terraform CI/CD for the dev environment
#
#   Pull request  ->  security scan  ->  fmt / validate / plan  ->  plan posted as a PR comment
#   Merge to main ->  security scan  ->  plan  ->  apply to dev
#
# AWS access uses GitHub OIDC (no stored keys):
#   plan jobs  -> read-only role   (secret AWS_PLAN_ROLE_ARN)
#   apply job  -> deploy role      (secret AWS_APPLY_ROLE_ARN), only via the "dev" environment
# ---------------------------------------------------------------
name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - ".github/workflows/**"
  workflow_dispatch: {}

# Least privilege for the GitHub token itself
permissions:
  contents: read

# Never run two pipelines on the same branch at once (protects state)
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  WORKDIR: envs/dev
  PLAN_ROLE_ARN: arn:aws:iam::211125360310:role/github-actions-terraform-plan
  APPLY_ROLE_ARN: arn:aws:iam::211125360310:role/github-actions-terraform-apply

jobs:
  # 1) Static security scan of all Terraform code (no AWS access needed)
  security-scan:
    name: Security scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: checkov --directory . --framework terraform --compact --quiet

  # 2) Format, validate and plan using the READ-ONLY role
  plan:
    name: Plan (dev)
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
      id-token: write        # lets the job request a GitHub OIDC token
      pull-requests: write   # lets the job comment the plan on the PR
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
    

      - name: Log in to AWS (read-only role via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{env.PLAN_ROLE_ARN}}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check formatting
        run: terraform fmt -check -recursive ../..

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=5m | tee plan.txt

      - name: Post plan to pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('${{ env.WORKDIR }}/plan.txt', 'utf8');
            const max = 60000;
            if (plan.length > max) {
              plan = plan.substring(plan.length - max);
              plan = '... (truncated, see the workflow log for the full plan)\n' + plan;
            }
            const body = [
              '### Terraform plan: `dev`',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```',
              plan,
              '```',
              '',
              '</details>',
              '',
              `Checkov scan passed. Triggered by @${context.actor}.`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  # 3) Apply to dev using the DEPLOY role - only after merge to main
  apply-dev:
    name: Apply (dev)
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: dev          # must match the OIDC trust in bootstrap/github-oidc.tf
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Log in to AWS (deploy role via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{env.APPLY_ROLE_ARN}}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -input=false -auto-approve -no-color -lock-timeout=5m

      - name: Smoke test - invoke the health check Lambda
        run: |
          aws lambda invoke --function-name secure-aws-platform-dev-health response.json
          cat response.json
          grep -q '"healthy"' response.json
